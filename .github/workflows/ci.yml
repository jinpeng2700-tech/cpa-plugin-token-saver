name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  linux-cshared:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.26.x"
          cache: true
      - run: go mod download
      - name: Check formatting
        run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test -race ./...
      - run: mkdir -p build && go build -buildmode=c-shared -o build/cpa-plugin-token-saver.so .
