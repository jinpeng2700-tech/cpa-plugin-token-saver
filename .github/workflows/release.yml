name: release

on:
  push:
    tags:
      - "v1.1.1"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    outputs:
      event_commit: ${{ steps.release_identity.outputs.event_commit }}
      manifest_sha256: ${{ steps.release_manifest.outputs.sha256 }}
      source_commit: ${{ steps.release_identity.outputs.source_commit }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.26.5"
          cache: true
          cache-dependency-path: go.sum

      - name: Bind event and build commits
        id: release_identity
        run: |
          set -euo pipefail
          event_commit=$(git rev-parse --verify "${GITHUB_SHA}^{commit}")
          source_commit=$(git rev-parse --verify "HEAD^{commit}")
          test "$event_commit" = "$source_commit"
          echo "event_commit=$event_commit" >> "$GITHUB_OUTPUT"
          echo "source_commit=$source_commit" >> "$GITHUB_OUTPUT"

      - name: Validate source and dependency notices
        run: |
          set -euo pipefail
          chmod +x scripts/check-notices.sh
          scripts/check-notices.sh
          go mod tidy -diff
          make ci

      - name: Build Linux release artifacts
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "v$(make print-version)"
          driver="$RUNNER_TEMP/release-container.sh"
          git -c core.autocrlf=false show "HEAD:scripts/release-container.sh" > "$driver"
          sh "$driver" . HEAD dist

      - name: Validate release metadata and checksums
        id: release_manifest
        run: |
          set -euo pipefail
          source_commit="${{ steps.release_identity.outputs.source_commit }}"
          version=$(make print-version)
          jq -e \
            --arg version "$version" \
            --arg tag "$GITHUB_REF_NAME" \
            --arg source_commit "$source_commit" \
            '.version == $version and
             .tag == $tag and
             .source_commit == $source_commit and
             .platform == "linux-amd64" and
             .abi == 1 and
             .rpc == 3' \
            dist/release-metadata.json >/dev/null
          (cd dist && sha256sum -c SHA256SUMS)
          test "$(wc -l < dist/SHA256SUMS)" -eq 5
          test "$(find dist -mindepth 1 -maxdepth 1 -type f | wc -l)" -eq 6
          manifest_sha256=$(sha256sum dist/SHA256SUMS | awk '{print $1}')
          echo "sha256=$manifest_sha256" >> "$GITHUB_OUTPUT"

      - name: Upload immutable release artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-dist-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            dist/token-saver-v1.1.1-linux-amd64.so
            dist/compat-probe-v1.1.1-linux-amd64
            dist/update-verifier-v1.1.1-linux-amd64
            dist/GLIBC_REQUIREMENTS.txt
            dist/release-metadata.json
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 1
          overwrite: false

  compatibility:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.26.5"
          cache: true
          cache-dependency-path: go.sum
      - name: Download release artifact for compatibility
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-dist-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/release-source

      - name: Prepare disposable candidate artifact copy
        env:
          EXPECTED_MANIFEST_SHA256: ${{ needs.build.outputs.manifest_sha256 }}
        run: |
          set -euo pipefail
          source_root="$RUNNER_TEMP/release-source"
          candidate_root="$RUNNER_TEMP/candidate-artifact"
          case "$source_root" in "$RUNNER_TEMP"/*) ;; *) exit 1 ;; esac
          observed_manifest_sha256=$(sha256sum "$source_root/SHA256SUMS" | awk '{print $1}')
          test "$observed_manifest_sha256" = "$EXPECTED_MANIFEST_SHA256"
          (cd "$source_root" && sha256sum -c SHA256SUMS)
          mkdir "$candidate_root"
          cp -a "$source_root/." "$candidate_root/"
          rm -rf "$source_root"
          version=$(make print-version)
          cp "$candidate_root/token-saver-v${version}-linux-amd64.so" "$candidate_root/token-saver.so"
          chmod +x "$candidate_root/compat-probe-v${version}-linux-amd64"

      - name: Resolve fixed real official compatibility matrix
        run: |
          set -euo pipefail
          printf '%s\n' v7.2.133 v7.2.137 > "$RUNNER_TEMP/candidates.txt"

      - name: Download and verify official candidates without executing them
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          index=0
          while IFS= read -r tag; do
            candidate_version="${tag#v}"
            case "$candidate_version" in
              ''|*[!0-9A-Za-z.+-]*) echo "official candidate has an invalid version" >&2; exit 1 ;;
            esac
            release_json_file="$RUNNER_TEMP/release-$index.json"
            curl --fail --silent --show-error --location \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "${GITHUB_API_URL}/repos/router-for-me/CLIProxyAPI/releases/tags/${tag}" \
              -o "$release_json_file"
            asset="CLIProxyAPI_${candidate_version}_linux_amd64.tar.gz"
            case "$asset" in *_no-plugin*) echo "refusing no-plugin host asset" >&2; exit 1 ;; esac
            asset_json=$(jq -ce --arg asset "$asset" \
              '[.assets[] | select(.name == $asset)] | if length == 1 then .[0] else error("candidate asset identity is ambiguous") end' \
              "$release_json_file")
            checksums_json=$(jq -ce \
              '[.assets[] | select(.name == "checksums.txt")] | if length == 1 then .[0] else error("checksums asset identity is ambiguous") end' \
              "$release_json_file")
            asset_id=$(printf '%s' "$asset_json" | jq -er '.id')
            asset_size=$(printf '%s' "$asset_json" | jq -er '.size')
            checksums_id=$(printf '%s' "$checksums_json" | jq -er '.id')
            checksums_size=$(printf '%s' "$checksums_json" | jq -er '.size')
            for value in "$asset_id" "$asset_size" "$checksums_id" "$checksums_size"; do
              case "$value" in ''|*[!0-9]*) echo "official asset identity is invalid" >&2; exit 1 ;; esac
              test "$value" -gt 0
            done
            candidate_dir="$RUNNER_TEMP/official-candidates/$index"
            mkdir -p "$candidate_dir"
            curl --fail --silent --show-error --location --retry 3 \
              -H "Accept: application/octet-stream" \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "${GITHUB_API_URL}/repos/router-for-me/CLIProxyAPI/releases/assets/${asset_id}" \
              -o "$candidate_dir/candidate.tar.gz"
            curl --fail --silent --show-error --location --retry 3 \
              -H "Accept: application/octet-stream" \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "${GITHUB_API_URL}/repos/router-for-me/CLIProxyAPI/releases/assets/${checksums_id}" \
              -o "$candidate_dir/checksums.txt"
            test "$(stat -c '%s' "$candidate_dir/candidate.tar.gz")" -eq "$asset_size"
            test "$(stat -c '%s' "$candidate_dir/checksums.txt")" -eq "$checksums_size"
            official_sha256=$(awk -v asset="$asset" '
              $2 == asset && length($1) == 64 && $1 !~ /[^0-9A-Fa-f]/ { count++; hash=tolower($1) }
              END { if (count != 1) exit 1; print hash }
            ' "$candidate_dir/checksums.txt")
            observed_sha256=$(sha256sum "$candidate_dir/candidate.tar.gz" | awk '{print $1}')
            test "$observed_sha256" = "$official_sha256"
            tar -xzf "$candidate_dir/candidate.tar.gz" -C "$candidate_dir"
            candidate=$(find "$candidate_dir" -maxdepth 2 -type f \( -name 'cli-proxy-api' -o -name 'CLIProxyAPI' \) -print -quit)
            test -n "$candidate"
            chmod +x "$candidate"
            index=$((index + 1))
          done < "$RUNNER_TEMP/candidates.txt"

      - name: Prove real host dispatch on baseline and fixed v7.2.137
        run: |
          set -euo pipefail
          version=$(make print-version)
          candidate_root="$RUNNER_TEMP/candidate-artifact"
          plugin="$candidate_root/token-saver.so"
          compat_probe="$candidate_root/compat-probe-v${version}-linux-amd64"
          mkdir -p "$RUNNER_TEMP/candidate-home" "$RUNNER_TEMP/go-cache" "$RUNNER_TEMP/go"
          candidate_environment=(
            "HOME=$RUNNER_TEMP/candidate-home"
            "LANG=C.UTF-8"
            "NO_PROXY=127.0.0.1,::1"
            "PATH=$PATH"
            "TMPDIR=$RUNNER_TEMP"
            "no_proxy=127.0.0.1,::1"
          )
          index=0
          while IFS= read -r tag; do
            candidate_dir="$RUNNER_TEMP/official-candidates/$index"
            candidate=$(find "$candidate_dir" -maxdepth 2 -type f \( -name 'cli-proxy-api' -o -name 'CLIProxyAPI' \) -print -quit)
            test -n "$candidate"
            env -i "${candidate_environment[@]}" \
              "$compat_probe" -candidate "$candidate" -plugin "$plugin" -timeout 45s
            env -i "${candidate_environment[@]}" \
              "$compat_probe" -mode core-only -candidate "$candidate" -timeout 45s
            env -i "${candidate_environment[@]}" \
              GOCACHE="$RUNNER_TEMP/go-cache" GOPATH="$RUNNER_TEMP/go" \
              CLIPROXYAPI_CANDIDATE="$candidate" TOKEN_SAVER_PLUGIN="$plugin" \
              go test -count=1 -run 'TestRealCandidate(Dispatch|CoreOnlyDispatch)$' ./test/compat
            index=$((index + 1))
          done < "$RUNNER_TEMP/candidates.txt"

  publish:
    needs:
      - build
      - compatibility
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      attestations: write
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Download compatibility-tested release artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-dist-${{ github.run_id }}-${{ github.run_attempt }}
          path: dist

      - name: Bind event, build, metadata, and remote tag commits
        env:
          BUILD_COMMIT: ${{ needs.build.outputs.source_commit }}
          EVENT_COMMIT: ${{ needs.build.outputs.event_commit }}
        run: |
          set -euo pipefail
          scripts/verify-release-identity.sh \
            "$EVENT_COMMIT" \
            "$BUILD_COMMIT" \
            dist/release-metadata.json \
            "https://github.com/${GITHUB_REPOSITORY}.git" \
            "$GITHUB_REF_NAME"

      - name: Validate publication artifact
        env:
          EXPECTED_MANIFEST_SHA256: ${{ needs.build.outputs.manifest_sha256 }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          test "$GITHUB_REF_NAME" = "v1.1.1"
          test "$(find dist -mindepth 1 -maxdepth 1 -type f | wc -l)" -eq 6
          observed_manifest_sha256=$(sha256sum dist/SHA256SUMS | awk '{print $1}')
          test "$observed_manifest_sha256" = "$EXPECTED_MANIFEST_SHA256"
          (cd dist && sha256sum -c SHA256SUMS)
          jq -e \
            --arg version "$version" \
            --arg tag "$GITHUB_REF_NAME" \
            '.version == $version and
             .tag == $tag and
             .platform == "linux-amd64" and
             .abi == 1 and
             .rpc == 3 and
             (.source_commit | test("^[0-9a-f]{40}$")) and
             ([.glibc_max, "2.32"] | sort_by(split(".") | map(tonumber)) | last == "2.32")' \
            dist/release-metadata.json >/dev/null

      - name: Attest exact release artifacts
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: dist/*

      - name: Publish immutable stable release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "release already exists; refusing mutation" >&2
            exit 1
          fi
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "Token Saver v1.1.1" \
            --notes "Linux amd64 plugin release. ABI 1, RPC 3. See release-metadata.json and GLIBC_REQUIREMENTS.txt."
