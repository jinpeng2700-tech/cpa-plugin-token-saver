<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Token 节省器 & Headroom 状态</title>
    <style>
        :root {
            --bg: #0f141c;
            --card-bg: #161f2e;
            --border: #233044;
            --text: #e2e8f0;
            --text-muted: #94a3b8;
            --green: #22c55e;
            --green-bg: rgba(34, 197, 94, 0.15);
            --red: #ef4444;
            --red-bg: rgba(239, 68, 68, 0.15);
            --accent: #eb5e28;
            --accent-hover: #f0713f;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            padding: 24px;
            display: flex;
            justify-content: center;
        }
        .container { width: 100%; max-width: 720px; }
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 24px;
            padding-bottom: 16px;
            border-bottom: 1px solid var(--border);
        }
        .header h1 { font-size: 20px; font-weight: 600; }
        .tag { font-size: 12px; padding: 3px 10px; border-radius: 12px; font-weight: 500; }
        .tag-active { background: var(--green-bg); color: var(--green); border: 1px solid var(--green); }
        .tag-inactive { background: var(--red-bg); color: var(--red); border: 1px solid var(--red); }
        .card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
        }
        .card-title {
            font-size: 15px;
            font-weight: 600;
            margin-bottom: 16px;
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            font-size: 14px;
        }
        .row:last-child { border-bottom: none; }
        .label { color: var(--text-muted); }
        .val { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-weight: 500; }
        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 13px;
            padding: 4px 10px;
            border-radius: 6px;
            font-weight: 500;
        }
        .status-ok { background: var(--green-bg); color: var(--green); }
        .status-err { background: var(--red-bg); color: var(--red); }
        .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
        .dot-ok { background: var(--green); box-shadow: 0 0 8px var(--green); }
        .dot-err { background: var(--red); box-shadow: 0 0 8px var(--red); }
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            background: var(--accent);
            color: #fff;
            border: none;
            border-radius: 8px;
            padding: 10px 18px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            width: 100%;
        }
        .btn:hover { background: var(--accent-hover); }
        .btn:disabled { opacity: 0.6; cursor: not-allowed; }
        .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; margin-top: 12px; }
        .metric-box {
            background: rgba(255,255,255,0.03);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 12px;
        }
        .metric-label { font-size: 12px; color: var(--text-muted); margin-bottom: 4px; }
        .metric-val { font-size: 18px; font-weight: 600; color: #fff; }
        .msg-box {
            margin-top: 16px;
            padding: 12px;
            border-radius: 8px;
            font-size: 13px;
            display: none;
        }
        .msg-ok { background: var(--green-bg); color: var(--green); border: 1px solid var(--green); display: block; }
        .msg-err { background: var(--red-bg); color: var(--red); border: 1px solid var(--red); display: block; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>⚡ Token 节省器 (Token Saver)</h1>
            <span id="pipelineTag" class="tag tag-active">运行中</span>
        </div>
        <div class="card">
            <div class="card-title">
                <span>Headroom 上下文压缩服务</span>
                <div id="headroomBadge" class="status-badge status-ok">
                    <span id="headroomDot" class="dot dot-ok"></span>
                    <span id="headroomStatusText">检测中...</span>
                </div>
            </div>
            <div class="row">
                <span class="label">代理地址 (URL)</span>
                <span id="headroomUrl" class="val">http://127.0.0.1:8787</span>
            </div>
            <div class="row">
                <span class="label">超时保护 (Timeout)</span>
                <span id="headroomTimeout" class="val">1500 ms (Fail-open)</span>
            </div>
            <div class="row">
                <span class="label">熔断状态 (Circuit)</span>
                <span id="headroomCircuit" class="val">closed (导通)</span>
            </div>
            <div class="row">
                <span class="label">最近自检反馈</span>
                <span id="lastTestTime" class="val">等待测试</span>
            </div>
            <div style="margin-top: 16px;">
                <button id="testBtn" class="btn" onclick="runSelfTest()">
                    <span>🔄 重新检测 Headroom 与 4 阶段连通性</span>
                </button>
            </div>
            <div id="msgBox" class="msg-box"></div>
        </div>
        <div class="card">
            <div class="card-title">
                <span>处理链统计指标 (Metrics)</span>
                <span id="pluginVer" style="font-size:12px; color:var(--text-muted)">v1.0.1</span>
            </div>
            <div class="grid">
                <div class="metric-box">
                    <div class="metric-label">RTK 工具输出压缩</div>
                    <div id="mRtk" class="metric-val">0 次</div>
                </div>
                <div class="metric-box">
                    <div class="metric-label">Headroom 历史压缩</div>
                    <div id="mHeadroom" class="metric-val">0 次</div>
                </div>
                <div class="metric-box">
                    <div class="metric-label">Caveman 提示精简</div>
                    <div id="mCaveman" class="metric-val">0 次</div>
                </div>
                <div class="metric-box">
                    <div class="metric-label">Ponytail 代码精简</div>
                    <div id="mPonytail" class="metric-val">0 次</div>
                </div>
            </div>
        </div>
    </div>
    <script>
        function getKey() {
            try {
                const urlParams = new URLSearchParams(window.location.search);
                if (urlParams.get('key')) return urlParams.get('key');
                return localStorage.getItem('cpa_management_key') || localStorage.getItem('management_key') || '';
            } catch (e) {
                return '';
            }
        }
        async function fetchStatus() {
            try {
                const key = getKey();
                const headers = key ? { Authorization: 'Bearer ' + key } : {};
                const res = await fetch('/v0/management/plugins/token-saver/status', { headers });
                if (!res.ok) throw new Error('HTTP ' + res.status);
                const data = await res.json();
                renderStatus(data);
            } catch (err) {
                console.error(err);
                document.getElementById('headroomBadge').className = 'status-badge status-err';
                document.getElementById('headroomDot').className = 'dot dot-err';
                document.getElementById('headroomStatusText').innerText = '未授权或服务未就绪';
            }
        }
        function renderStatus(data) {
            document.getElementById('pluginVer').innerText = 'v' + (data.build_version || '1.0.1');
            document.getElementById('pipelineTag').className = data.live ? 'tag tag-active' : 'tag tag-inactive';
            document.getElementById('pipelineTag').innerText = data.live ? '运行中' : '已停止';
            const effective = data.headroom_effective;
            const circuit = data.headroom_circuit || 'unknown';
            const badge = document.getElementById('headroomBadge');
            const dot = document.getElementById('headroomDot');
            const txt = document.getElementById('headroomStatusText');
            if (effective && circuit === 'closed') {
                badge.className = 'status-badge status-ok';
                dot.className = 'dot dot-ok';
                txt.innerText = '运行中 (已连接)';
            } else if (circuit === 'open') {
                badge.className = 'status-badge status-err';
                dot.className = 'dot dot-err';
                txt.innerText = '熔断告警 (不可达)';
            } else {
                badge.className = 'status-badge status-err';
                dot.className = 'dot dot-err';
                txt.innerText = '未启用或降级';
            }
            document.getElementById('headroomCircuit').innerText = circuit;
            if (data.last_self_test_at) {
                document.getElementById('lastTestTime').innerText = data.last_self_test_result + ' (' + new Date(data.last_self_test_at).toLocaleTimeString() + ')';
            }
            const m = data.metrics || {};
            document.getElementById('mRtk').innerText = (m.rtk?.executed || 0) + ' 次';
            document.getElementById('mHeadroom').innerText = (m.headroom?.executed || 0) + ' 次';
            document.getElementById('mCaveman').innerText = (m.caveman?.executed || 0) + ' 次';
            document.getElementById('mPonytail').innerText = (m.ponytail?.executed || 0) + ' 次';
        }
        async function runSelfTest() {
            const btn = document.getElementById('testBtn');
            const msg = document.getElementById('msgBox');
            btn.disabled = true;
            btn.innerHTML = '<span>⏳ 正在进行全链路探测...</span>';
            msg.className = 'msg-box';
            msg.style.display = 'none';
            const start = performance.now();
            try {
                const key = getKey();
                const headers = { 'Content-Type': 'application/json' };
                if (key) headers['Authorization'] = 'Bearer ' + key;
                const res = await fetch('/v0/management/plugins/token-saver/self-test', {
                    method: 'POST',
                    headers: headers,
                    body: '{}'
                });
                const elapsed = Math.round(performance.now() - start);
                const data = await res.json();
                if (res.ok && data.result === 'passed') {
                    msg.className = 'msg-box msg-ok';
                    msg.innerText = '✅ 探测通过！Headroom 与 4 阶段处理链可达（耗时 ' + elapsed + 'ms）。';
                } else {
                    msg.className = 'msg-box msg-err';
                    msg.innerText = '❌ 探测未通过: ' + (data.error || '自检失败') + '（耗时 ' + elapsed + 'ms）。';
                }
                await fetchStatus();
            } catch (err) {
                msg.className = 'msg-box msg-err';
                msg.innerText = '❌ 请求异常: ' + err.message;
            } finally {
                btn.disabled = false;
                btn.innerHTML = '<span>🔄 重新检测 Headroom 与 4 阶段连通性</span>';
            }
        }
        fetchStatus();
        setInterval(fetchStatus, 10000);
    </script>
</body>
</html>
