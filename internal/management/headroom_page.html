<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Token &#33410;&30465;&##22120; & Headroom &#29366;&24577;</title>
    <style>
        :root {
            --bg: #0f141c;
            --card-bg: #161f2e;
            --border: #233044;
            --text: #e2e8f0;
            --text-muted: #94a3b8;
            --green: #22c55e;
            --green-bg: rgba(34, 197, 94, 0.15);
            --red: #ef4444;
            --red-bg: rgba(239, 68, 68, 0.15);
            --accent: #eb5e28;
            --accent-hover: #f0713f;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            padding: 24px;
            display: flex;
            justify-content: center;
        }
        .container { width: 100%; max-width: 720px; }
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 24px;
            padding-bottom: 16px;
            border-bottom: 1px solid var(--border);
        }
        .header h1 { font-size: 20px; font-weight: 600; }
        .tag { font-size: 12px; padding: 3px 10px; border-radius: 12px; font-weight: 500; }
        .tag-active { background: var(--green-bg); color: var(--green); border: 1px solid var(--green); }
        .tag-inactive { background: var(--red-bg); color: var(--red); border: 1px solid var(--red); }
        .card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
        }
        .card-title {
            font-size: 15px;
            font-weight: 600;
            margin-bottom: 16px;
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            font-size: 14px;
        }
        .row:last-child { border-bottom: none; }
        .label { color: var(--text-muted); }
        .val { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-weight: 500; }
        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 13px;
            padding: 4px 10px;
            border-radius: 6px;
            font-weight: 500; }
        .status-ok { background: var(--green-bg); color: var(--green); }
        .status-err { background: var(--red-bg); color: var(--red); }
        .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
        .dot-ok { background: var(--green); box-shadow: 0 0 8px var(--green); }
        .dot-err { background: var(--red); box-shadow: 0 0 8px var(--red); }
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            background: var(--accent);
            color: #fff;
            border: none;
            border-radius: 8px;
            padding: 10px 18px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            width: 100%;
        }
        .btn:hover { background: var(--accent-hover); }
        .btn:disabled { opacity: 0.6; cursor: not-allowed; }
        .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; margin-top: 12px; }
        .metric-box {
            background: rgba(255,255,255,0.03);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 12px;
        }
        .metric-label { font-size: 12px; color: var(--text-muted); margin-bottom: 4px; }
        .metric-val { font-size: 18px; font-weight: 600; color: #fff; }
        .msg-box {
            margin-top: 16px;
            padding: 12px;
            border-radius: 8px;
            font-size: 13px;
            display: none;
        }
