<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Token 节省器 & Headroom 状态</title>
    <style>
        :root {
            --bg: #0f141c;
            --card-bg: #161f2e;
            --border: #233044;
            --text: #e2e8f0;
            --text-muted: #94a3b8;
            --green: #22c55e;
            --green-bg: rgba(34, 197, 94, 0.15);
            --red: #ef4444;
            --red-bg: rgba(239, 68, 68, 0.15);
            --accent: #eb5e28;
            --accent-hover: #f0713f;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            padding: 24px;
            display: flex;
            justify-content: center;
        }
        .container { width: 100%; max-width: 720px; }
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 24px;
            padding-bottom: 16px;
            border-bottom: 1px solid var(--border);
        }
        .header h1 { font-size: 20px; font-weight: 600; }
        .tag { font-size: 12px; padding: 3px 10px; border-radius: 12px; font-weight: 500; }
        .tag-active { background: var(--green-bg); color: var(--green); border: 1px solid var(--green); }
        .tag-inactive { background: var(--red-bg); color: var(--red); border: 1px solid var(--red); }
        .card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
        }
        .card-title {
            font-size: 15px;
            font-weight: 600;
            margin-bottom: 16px;
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            font-size: 14px;
        }
        .row:last-child { border-bottom: none; }
        .label { color: var(--text-muted); }
        .val { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-weight: 500; }
        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 13px;
            padding: 4px 10px;
            border-radius: 6px;
            font-weight: 500;
        }
        .status-ok { background: var(--green-bg); color: var(--green); }
        .status-err { background: var(--red-bg); color: var(--red); }
        .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
        .dot-ok { background: var(--green); box-shadow: 0 0 8px var(--green); }
        .dot-err { background: var(--red); box-shadow: 0 0 8px var(--red); }
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            background: var(--accent);
            color: #fff;
            border: none;
            border-radius: 8px;
            padding: 10px 18px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            width: 100%;
        }
        .btn:hover { background: var(--accent-hover); }
        .btn:disabled { opacity: 0.6; cursor: not-allowed; }
        .msg-box {
            margin-top: 16px;
            padding: 12px;
            border-radius: 8px;
            font-size: 13px;
            display: none;
        }
        .msg-ok { background: var(--green-bg); color: var(--green); border: 1px solid var(--green); display: block; }
        .msg-err { background: var(--red-bg); color: var(--red); border: 1px solid var(--red); display: block; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>⚡ Token 节省器 (Token Saver)</h1>
            <span id="pipelineTag" class="tag tag-inactive">检测中</span>
        </div>
        <div class="card">
            <div class="card-title">
                <span>Headroom 上下文压缩服务</span>
                <div id="headroomBadge" class="status-badge status-ok">
                    <span id="headroomDot" class="dot dot-ok"></span>
                    <span id="headroomStatusText">检测中...</span>
                </div>
            </div>
            <div class="row">
                <span class="label">配置状态</span>
                <span id="headroomEnabled" class="val">检测中</span>
            </div>
            <div class="row">
                <span class="label">被动健康状态</span>
                <span id="headroomPassiveStatus" class="val">unknown</span>
            </div>
            <div class="row">
                <span class="label">熔断状态 (Circuit)</span>
                <span id="headroomCircuit" class="val">unknown</span>
            </div>
            <div class="row">
                <span class="label">检测方式</span>
                <span class="val">只读快照，不主动请求 Headroom</span>
            </div>
            <div style="margin-top: 16px;">
                <button id="testBtn" class="btn" onclick="refreshStatus()">
                    <span>🔄 刷新状态</span>
                </button>
            </div>
            <div id="msgBox" class="msg-box"></div>
        </div>
    </div>
    <script>
        let statusTimer;
        async function fetchStatus(showMessage = false) {
            try {
                const startedAt = performance.now();
                const res = await fetch('/v0/resource/plugins/token-saver/headroom/status', { cache: 'no-store' });
                if (!res.ok) {
                    if (res.status >= 400 && res.status < 500 && statusTimer) {
                        clearInterval(statusTimer);
                        statusTimer = undefined;
                    }
                    throw new Error('HTTP ' + res.status);
                }
                const data = await res.json();
                renderStatus(data);
                if (showMessage) {
                    const msg = document.getElementById('msgBox');
                    msg.className = 'msg-box msg-ok';
                    msg.innerText = '✅ 状态刷新完成（耗时 ' + Math.round(performance.now() - startedAt) + 'ms）。';
                }
            } catch (err) {
                console.error(err);
                document.getElementById('headroomBadge').className = 'status-badge status-err';
                document.getElementById('headroomDot').className = 'dot dot-err';
                document.getElementById('headroomStatusText').innerText = '状态接口不可用';
                if (showMessage) {
                    const msg = document.getElementById('msgBox');
                    msg.className = 'msg-box msg-err';
                    msg.innerText = '❌ 检测失败: ' + err.message;
                }
            }
        }
        function renderStatus(data) {
            const enabled = data.enabled === true;
            const status = data.status || 'unknown';
            const circuit = data.circuit || 'unknown';
            document.getElementById('pipelineTag').className = enabled ? 'tag tag-active' : 'tag tag-inactive';
            document.getElementById('pipelineTag').innerText = enabled ? '已启用' : '未启用';
            document.getElementById('headroomEnabled').innerText = enabled ? 'enabled' : 'disabled';
            document.getElementById('headroomPassiveStatus').innerText = status;
            const badge = document.getElementById('headroomBadge');
            const dot = document.getElementById('headroomDot');
            const txt = document.getElementById('headroomStatusText');
            if (status === 'ready' && circuit === 'closed') {
                badge.className = 'status-badge status-ok';
                dot.className = 'dot dot-ok';
                txt.innerText = '最近请求正常';
            } else if (status === 'degraded' || circuit === 'open') {
                badge.className = 'status-badge status-err';
                dot.className = 'dot dot-err';
                txt.innerText = '最近请求失败或熔断';
            } else if (!enabled) {
                badge.className = 'status-badge status-err';
                dot.className = 'dot dot-err';
                txt.innerText = '未启用';
            } else {
                badge.className = 'status-badge status-err';
                dot.className = 'dot dot-err';
                txt.innerText = '尚无请求样本';
            }
            document.getElementById('headroomCircuit').innerText = circuit;
        }
        async function refreshStatus() {
            const btn = document.getElementById('testBtn');
            const msg = document.getElementById('msgBox');
            btn.disabled = true;
            btn.innerHTML = '<span>⏳ 正在刷新...</span>';
            msg.className = 'msg-box';
            try {
                await fetchStatus(true);
            } finally {
                btn.disabled = false;
                btn.innerHTML = '<span>🔄 刷新状态</span>';
            }
        }
        fetchStatus();
        statusTimer = setInterval(fetchStatus, 30000);
    </script>
</body>
</html>
