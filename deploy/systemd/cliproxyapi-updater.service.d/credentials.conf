# Requires systemd >= 247. Do not install this drop-in on systemd 239.
# Install as /root/.config/systemd/user/cliproxyapi-update.service.d/credentials.conf;
# this repository path retains the plan's generic template name.
[Service]
ExecStart=
ExecStart=/root/cliproxyapi/update-wrapper.sh latest
LoadCredential=cliproxyapi-management-key:/root/.config/cliproxyapi/credentials/management-key
